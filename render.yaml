services:
  - type: web
    name: caredify-api
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p weights &&
      curl -L "https://drive.usercontent.google.com/download?id=1mDuSy5Z851swKc4PRsogKOziwFcjgw1T&export=download&confirm=t"
      -o weights/caredify_modele_a_1lead_mobile.tflite &&
      python -c "
      import os;
      s = os.path.getsize('weights/caredify_modele_a_1lead_mobile.tflite');
      assert s > 100000, f'Fichier GDrive invalide: {s} bytes';
      import tflite_runtime.interpreter as tflite;
      tflite.Interpreter('weights/caredify_modele_a_1lead_mobile.tflite');
      print('TFLite OK, taille:', s)
      "
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false