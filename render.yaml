services:
  - type: web
    name: caredify-api
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p weights &&
      curl -L "https://drive.google.com/uc?export=download&id=1As4YotMfM19xFawOvzsH1lS_oBrtkBv8" -o weights/caredify_modele_a_1lead_mobile.tflite &&
      ls -lh weights/
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false