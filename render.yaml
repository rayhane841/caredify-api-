services:
  - type: web
    name: caredify-api
    runtime: python
    buildCommand: >-
      pip install -r requirements.txt &&
      mkdir -p weights &&
      curl -L "https://github.com/rayhane841/caredify-api-/releases/download/v1.0.0/caredify_modele_a_1lead_mobile.tflite" -o weights/caredify_modele_a_1lead_mobile.tflite &&
      python -c "import os; s=os.path.getsize('weights/caredify_modele_a_1lead_mobile.tflite'); assert s>100000, f'Fichier trop petit: {s}'; print('✅ TFLite OK, taille:', s, 'bytes')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false